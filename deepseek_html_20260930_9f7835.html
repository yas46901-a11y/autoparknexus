pages.route = {
  html: function(){
    return `
    <section class="grid" style="grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)">
      <div class="card tight">
        <div class="card-head">
          <h3>Route Map — A* Grid Pathfinding</h3>
          <span class="hint">blocked cells excluded</span>
        </div>
        <div class="lot-wrap"><svg class="lot" id="routeLot"></svg></div>
        <div class="row" style="margin-top:12px">
          <button class="btn btn-primary" id="btnPlan">${icon("route",14)} Recalculate Route</button>
          <button class="btn" id="btnObst2">Toggle Obstacles</button>
        </div>
      </div>

      <div style="min-width:0">
        <div class="card">
          <div class="card-head"><h3>Route Status</h3></div>
          <div id="routeStats"></div>
        </div>

        <div class="card" style="margin-top:15px">
          <div class="card-head"><h3>How the planner works</h3></div>
          <p class="small muted">The lot is discretised into a 20 × 14 grid. Cells inside parking bands are
          blocked, except the cells of the selected target space. Obstacles block every cell within their
          radius plus a 0.45-unit safety margin.</p>
          <p class="small muted">A* searches with an octile heuristic and 8-directional movement (no corner
          cutting). The resulting cell path is then string-pulled: intermediate waypoints are removed
          whenever a straight segment stays clear of blocked cells with a 0.55-unit clearance corridor.</p>
          <p class="tiny dim">The simulated planner demonstrates the concept only. It is not validated for
          real-world vehicle control.</p>
        </div>

        <div class="card" style="margin-top:15px">
          <div class="card-head"><h3>Alternative Spaces</h3></div>
          <div id="routeAlts"></div>
        </div>
      </div>
    </section>`;
  },

  mount: function(root){
    const lot = new LotView(root.querySelector("#routeLot"), { interactive:true });
    activeLots.push(lot);

    root.querySelector("#btnPlan").addEventListener("click", function(){
      const sp = state.spaces.find(function(s){ return s.id === state.targetId; }) ||
                 state.spaces.find(function(s){ return s.status === "free"; });
      if(!sp){ logEvt("warn", "No free space available to plan a route."); emit(); return; }
      const res = computeRouteTo(sp);
      if(res){
        state.targetId = sp.id;
        state.path = res.path;
        state.sim.vehicleS = 0;
        logEvt("ok", "Route recalculated to " + sp.id + " — " + res.length.toFixed(1) + " units.");
        logAI("Route recalculated to " + sp.id + ". A* found a collision-free path of " +
              res.length.toFixed(1) + " grid units.");
      } else {
        state.path = [];
        logEvt("danger", "No collision-free route to " + sp.id + " from the current position.");
        logAI("No collision-free route exists to " + sp.id + " right now.");
      }
      emit();
    });
    root.querySelector("#btnObst2").addEventListener("click", toggleObstacles);
  },

  update: function(){
    const stats = $("#routeStats");
    if(!stats) return;
    const sp = state.spaces.find(function(s){ return s.id === state.targetId; });
    const len = state.path.length > 1 ? pathLength(state.path) : 0;
    const blockedCells = buildBlockedSet(state.obstacles).size;

    if(!sp || !state.path.length){
      stats.innerHTML = '<div class="empty">No active route.<br>Select a space and press "Recalculate Route".</div>';
    } else {
      const a = sp.assessment;
      const complexity = a ? (a.difficulty < 0.45 ? "Low" : a.difficulty < 0.7 ? "Moderate" : "High") : "—";
      const status = state.sim.status === "blocked"
        ? '<span class="badge bad">BLOCKED</span>'
        : '<span class="badge ok">CLEAR</span>';
      stats.innerHTML =
        '<div class="kv"><span class="k">Target space</span><span class="v mono" style="color:#67e8f9">' + sp.id + '</span></div>' +
        '<div class="kv"><span class="k">Route status</span><span class="v">' + status + '</span></div>' +
        '<div class="kv"><span class="k">Route distance</span><span class="v">' + len.toFixed(1) + ' units</span></div>' +
        '<div class="kv"><span class="k">Waypoints</span><span class="v">' + (state.path.length-1) + '</span></div>' +
        '<div class="kv"><span class="k">Blocked grid cells</span><span class="v">' + blockedCells + '</span></div>' +
        '<div class="kv"><span class="k">Maneuver complexity</span><span class="v">' + complexity + '</span></div>';
    }

    const alts = $("#routeAlts");
    if(alts){
      const ranked = state.scores.filter(function(s){ return s.reachable; })
                                 .sort(function(a,b){ return b.score - a.score; }).slice(0,5);
      alts.innerHTML = ranked.length
        ? ranked.map(function(r){
            const spc = state.spaces.find(function(s){ return s.id === r.id; });
            const good = spc && !spc.unsafe;
            return '<div class="row" style="justify-content:space-between;padding:7px 0;border-bottom:1px dashed #16222e">' +
              '<span class="small mono">' + r.id +
                (state.targetId === r.id ? ' <span class="badge info">TARGET</span>' : "") + '</span>' +
              '<span class="tiny" style="color:' + (good ? "#86efac" : "#fca5a5") + '">' +
                r.distance.toFixed(1) + ' units · score ' + r.score.toFixed(1) + '</span></div>';
          }).join("")
        : '<div class="empty">No reachable routes. Run a scan or "Find me a spot" first.</div>';
    }
  }
};

      }
      state.metrics.scans++;
      state.metrics.spacesScanned = state.spaces.length;
      state.metrics.vacantDetected = vacant;
      state.metrics.obstaclesIdentified = state.obstacles.length;
      logEvt("ok", vacant + " vacant spaces detected out of " + state.spaces.length + ".");
      logAI("Scan complete: " + vacant + " vacant spaces detected out of " + state.spaces.length +
            ". One bay is reserved, so it is excluded from selection.");
      speak(vacant + " vacant spaces detected.");
    }
  },
  {
    title: "Decision — rejecting an unsafe bay",
    page: "live",
    cap: "Scene 3 — The nearest vacant bay (A02) has an obstacle blocking its approach lane. The system rejects it rather than treating it as safe just because it is empty.",
    apply: function(){
      state.recommendedId = null;
      state.targetId = null;
      state.path = [];
      runAssessment();
      logEvt("warn", "Obstacle detected at the approach of A02 — entry lane blocked.");
      logAI("Bay A02 is empty, but a trolley blocks its approach lane. Its clearance is 33%, below the " +
            "34% safety threshold, and no collision-free route exists to it. A02 is rejected.");
      speak("Bay A 0 2 rejected. Approach lane blocked.");
      state.metrics.unsafeRejections++;
    }
  },
  {
    title: "Decision — choosing the safest space",
    page: "live",
    cap: "Scene 4 — The recommendation algorithm compares the remaining candidates and selects the best-scoring safe space, explaining the reasoning in plain language.",
    apply: function(){
      const ranked = runRecommendation();
      if(ranked && ranked.length){
        state.recommendedId = ranked[0].id;
        state.targetId = ranked[0].id;
      }
      speak("Recommended space " + (state.targetId || "") + ".");
    }
  },
  {
    title: "Action — route planning and guidance",
    page: "live",
    cap: "Scene 5 — The route planner draws a collision-free path to the chosen space and the vehicle begins to follow it. A new obstacle then appears on the route.",
    apply: function(){
      const sp = state.spaces.find(function(s){ return s.id === state.targetId; });
      if(!sp){
        logEvt("warn", "No target space available for the judge demo.");
        return;
      }
      const res = computeRouteTo(sp);
      if(res){
        state.path = res.path;
        state.sim.vehicleS = 0;
        state.sim.stage = STAGES.findIndex(function(s){ return s.key === "guide"; });
        state.sim.stageT = 0;
        state.sim.status = "running";
        state.sim.injected = false;
        state.sim.mode = "judge";
        logEvt("ok", "Route planned to " + sp.id + " — " + res.length.toFixed(1) + " units.");
        logAI("A* planned a collision-free route of " + res.length.toFixed(1) + " grid units to space " +
              sp.id + ". Guidance engaged.");
        speak("Route planned. Guiding to space " + sp.id + ".");
      } else {
        state.path = [];
        state.sim.status = "nosafe";
        logEvt("danger", "No route available to the selected space.");
      }
    }
  },
  {
    title: "Reaction — dynamic rerouting",
    page: "live",
    cap: "Scene 6 — A new moving obstacle appears on the planned route. The maneuver pauses, the blockage is detected, and an alternative safe route is calculated automatically.",
    apply: function(){
      // If the sim has not yet detected the obstacle, force the reroute now.
      if(state.sim.status !== "blocked"){
        const total = pathLength(state.path);
        if(total > 4){
          const p = pointAt(state.path, total * 0.5);
          const cx = Math.floor(p.x) + 0.5;
          const cy = Math.floor(p.y) + 0.5;
          let ok = true;
          for(let i=0;i<state.obstacles.length;i++){
            if(Math.hypot(state.obstacles[i].x - cx, state.obstacles[i].y - cy) < 1.6){ ok = false; break; }
          }
          if(ok && cy >= LANE_TOP && cy <= LANE_BOTTOM){
            state.obstacles.push({ id:"OD9", x:cx, y:cy, r:0.7, type:"dynamic", label:"Moving obstacle" });
          }
        }
        state.sim.status = "blocked";
        state.sim.blockedT = 0;
      }

      const sp = state.spaces.find(function(s){ return s.id === state.targetId; });
      const res = sp ? computeRouteTo(sp) : null;
      if(res){
        state.path = res.path;
        state.sim.vehicleS = 0;
        state.sim.status = "running";
        state.sim.injected = true;
        state.sim.stageT = 0;
        state.sim.stage = STAGES.findIndex(function(s){ return s.key === "guide"; });
        state.metrics.reroutes++;
        logEvt("ok", "Alternative safe route calculated (" + res.length.toFixed(1) + " units).");
        logAI("The new obstacle blocks the original route. The maneuver was paused, the route was " +
              "recalculated around the blockage, and guidance resumed. New route: " +
              res.length.toFixed(1) + " grid units.");
        speak("Obstacle detected. Route recalculated. Resuming.");
      } else {
        state.path = [];
        state.sim.status = "nosafe";
        logEvt("danger", "No safe alternative route found.");
        logAI("No safe alternative route exists. The vehicle should wait and the lot should be rescanned.");
        speak("No safe alternative route found.");
      }
    }
  },
  {
    title: "Completion — maneuver finished",
    page: "live",
    cap: "Scene 7 — The vehicle follows the recalculated route and completes the simulated parking maneuver. The bay is now marked occupied.",
    apply: function(){
      const sp = state.spaces.find(function(s){ return s.id === state.targetId; });
      if(sp){
        sp.status = "occupied";
        sp.unsafe = false;
        state.vehicle.parked = true;
        state.vehicle.spaceId = sp.id;
        state.session.spaceId = sp.id;
        state.vehicle.x = sp.col + 1.5;
        state.vehicle.y = sp.row + 1.5;
      }
      state.path = [];
      state.sim.status = "done";
      state.metrics.completions++;
      state.metrics.runs++;
      state.metrics.timeSavedMin += 3.5;
      state.metrics.fuelSavedL += 0.12;
      state.metrics.co2SavedKg += 0.28;
      const minutes = 35 + (hash(state.targetId || "x") % 60);
      state.session.simMinutes = minutes;
      state.metrics.parkTimes.push(+(minutes/10).toFixed(1));
      logEvt("ok", "Parking maneuver completed in simulation — vehicle parked in " + (state.targetId || "—") + ".");
      logAI("Maneuver complete. Vehicle parked in space " + (state.targetId || "—") +
            ". Session duration: " + minutes + " simulated minutes.");
      speak("Parking complete in space " + (state.targetId || "") + ".");
    }
  },
  {
    title: "Billing — automatic charge on exit",
    page: "live",
    cap: "Scene 8 — The vehicle exits. The number plate is read, the parking duration is computed, and an itemised bill is generated automatically — including an EV discount.",
    apply: function(){
      if(!state.session.plate){
        state.session.plate = mkPlate();
        state.session.entryClock = nowStr();
        state.session.active = true;
      }
      if(!state.session.simMinutes) state.session.simMinutes = 45;
      state.session.active = false;
      state.session.receipt = computeBill();
      state.vehicle.parked = false;
      state.vehicle.spaceId = null;
      state.vehicle.x = EXIT.x;
      state.vehicle.y = EXIT.y;
      state.path = [];
      state.sim.status = "idle";
      logEvt("ok", "Vehicle " + state.session.plate + " exited. Bill generated.");
      logAI("Billing computed for plate " + state.session.plate + " — " +
            state.session.receipt.minutes + " simulated minutes, total " + CURRENCY +
            state.session.receipt.total.toFixed(2) +
            (state.session.receipt.note ? " (" + state.session.receipt.note + ")" : "") + ".");
      speak("Billing complete. Total " + state.session.receipt.total.toFixed(0) + " rupees.");
      showReceipt();
    }
  },
  {
    title: "Prediction — peak-hour demand",
    page: "analytics",
    cap: "Scene 9 — A simulated 24-hour demand forecast shows the expected peaks. The system can warn drivers and pre-reserve bays ahead of predicted busy periods.",
    apply: function(){
      logEvt("info", "Peak-hour demand forecast displayed (simulated).");
      logAI("The demand curve is simulated, not measured. It peaks around 08:00 and 18:00, which is when " +
            "safety-aware recommendations matter most.");
      speak("Peak hour demand prediction displayed.");
    }
  },
  {
    title: "Impact & summary",
    page: "analytics",
    cap: "Scene 10 — Summary: the nearest empty bay was rejected as unsafe, a safer alternative was chosen, a new obstacle triggered dynamic rerouting, the maneuver completed, and the session was billed automatically. Impact counters show simulated time, fuel and CO₂ savings.",
    apply: function(){
      const m = state.metrics;
      logEvt("ok", "Judge demo complete — all decisions are auditable in the AI decision log.");
      logAI("Demo summary — runs: " + m.runs + ", completed maneuvers: " + m.completions +
            ", reroutes: " + m.reroutes + ", unsafe bays rejected: " + m.unsafeRejections +
            ". Simulated savings: " + m.timeSavedMin.toFixed(1) + " min, " +
            m.fuelSavedL.toFixed(2) + " L fuel, " + m.co2SavedKg.toFixed(2) + " kg CO₂.");
      speak("Demo complete. All decisions are logged and auditable.");
    }
  }
];

function startJudgeDemo(){
  if(state.judge.active && state.judge.idx > 0){
    // Already running — restart cleanly
    applyJudgeScene(0);
    return;
  }
  state.judge.active = true;
  state.judge.idx = 0;
  state.judge.paused = false;
  $("#judgeBar").classList.add("show");
  document.body.classList.add("judge-open");
  const pb = $("#judgePause");
  if(pb) pb.textContent = "⏸ Pause";
  applyJudgeScene(0);
}

function applyJudgeScene(i){
  const idx = clamp(i, 0, JUDGE_SCENES.length - 1);
  state.judge.idx = idx;
  const sc = JUDGE_SCENES[idx];

  // Navigate first so the page reflects the scene
  if(sc.page && currentPage !== sc.page){
    go(sc.page);
  }

  sc.apply();
  renderJudgeUi();
  emit();
}

function renderJudgeUi(){
  const i = state.judge.idx;
  const sc = JUDGE_SCENES[i];
  const no = $("#judgeSceneNo");
  const ti = $("#judgeTitle");
  const cap = $("#judgeCap");
  if(no) no.textContent = "Scene " + (i+1) + " / " + JUDGE_SCENES.length;
  if(ti) ti.textContent = sc.title || "—";
  if(cap) cap.textContent = sc.cap || "—";

  const dots = $("#judgeDots");
  if(dots){
    dots.innerHTML = JUDGE_SCENES.map(function(_, k){
      return '<i class="' + (k === i ? "on" : (k < i ? "past" : "")) + '"></i>';
    }).join("");
  }
  const prev = $("#judgePrev");
  const next = $("#judgeNext");
  if(prev) prev.disabled = (i === 0);
  if(next) next.disabled = (i === JUDGE_SCENES.length - 1);
}

function hideJudgeBar(){
  const bar = $("#judgeBar");
  if(bar) bar.classList.remove("show");
  document.body.classList.remove("judge-open");
}

/** Auto-advance the judge demo when the simulation reaches certain states. */
function judgeTick(){
  if(!state.judge.active || state.judge.paused) return;
  const i = state.judge.idx;

  // Scene 5 (index 4) → when the sim blocks, move to scene 6 (index 5)
  if(i === 4 && state.sim.status === "blocked"){
    applyJudgeScene(5);
    return;
  }
  // Scene 6 (index 5) → when the sim completes, move to scene 7 (index 6)
  if(i === 5 && state.sim.status === "done"){
    applyJudgeScene(6);
    return;
  }
}

/* Judge bar buttons */
$("#judgeNext").addEventListener("click", function(){
  if(state.judge.idx < JUDGE_SCENES.length - 1) applyJudgeScene(state.judge.idx + 1);
});
$("#judgePrev").addEventListener("click", function(){
  if(state.judge.idx > 0) applyJudgeScene(state.judge.idx - 1);
});
$("#judgeRestart").addEventListener("click", function(){
  if(detectTimer){ clearTimeout(detectTimer); detectTimer = null; }
  state.judge.paused = false;
  const pb = $("#judgePause");
  if(pb) pb.textContent = "⏸ Pause";
  applyJudgeScene(0);
});
$("#judgeClose").addEventListener("click", function(){
  if(detectTimer){ clearTimeout(detectTimer); detectTimer = null; }
  state.judge.active = false;
  state.judge.paused = false;
  hideJudgeBar();
  resetSim(true);
  logEvt("info", "Judge demo exited. Simulation reset.");
  emit();
});
$("#judgePause").addEventListener("click", function(){
  state.judge.paused = !state.judge.paused;
  this.textContent = state.judge.paused ? "▶ Resume" : "⏸ Pause";
  if(state.judge.paused){
    if(state.sim.status === "running") state.sim.status = "paused";
  } else {
    if(state.sim.status === "paused") state.sim.status = "running";
  }
  emit();
});
$("#judgeBtn").addEventListener("click", startJudgeDemo);

/* ==========================================================================
   INIT
   ========================================================================== */
function init(){
  state.spaces = freshSpaces();
  state.obstacles = freshObstacles();

  buildNav();

  const menuBtn = $("#menuBtn");
  if(menuBtn){
    menuBtn.addEventListener("click", function(){
      const sb = $("#sidebar");
      if(sb) sb.classList.toggle("open");
    });
  }

  const voiceBtn = $("#voiceBtn");
  if(voiceBtn) voiceBtn.addEventListener("click", toggleVoice);

  // Close the sidebar when tapping outside on mobile
  document.addEventListener("click", function(e){
    const sb = $("#sidebar");
    const mb = $("#menuBtn");
    if(!sb || !sb.classList.contains("open")) return;
    if(sb.contains(e.target) || (mb && mb.contains(e.target))) return;
    sb.classList.remove("open");
  });

  updateVoiceBtn();
  go("overview");

  logEvt("info", "AutoPark Nexus prototype loaded — all data is simulated.");
  logAI("System initialised. All detections, predictions and billing are simulated for demonstration.");
  updateTopbar();

  requestAnimationFrame(raf);
}

/* Expose handlers used by inline onclick attributes */
window.closeModal = closeModal;
window.selectSpace = selectSpace;
window.whyThisSpace = whyThisSpace;
window.showReceipt = showReceipt;

init();
</script>
